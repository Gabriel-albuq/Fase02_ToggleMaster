# postgres-db-auth-service.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db-auth-service
  labels:
    app: postgres-db-auth-service
spec:
  replicas: 1
  matchLabels:
    app: postgres-db-auth-service
  template:
    metadata:
      labels:
        app: postgres-db-auth-service
    spec:
      containers:
        - name: postgres-db-auth-service
          image: 798350130470.dkr.ecr.us-east-1.amazonaws.com/auth-service
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                name: auth-service-secrets
                key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                name: auth-service-secrets
                key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                name: auth-service-secrets
                key: DB_DATABASE_AUTH_SERVICE
          volumeMounts:
            - name: pgdata_auth_service
              mounthPath: /var/lib/postgresql
      volumes:
        - name: pgdata_auth_service
          persistentVolumeClaim:
            claimName: pgdata_auth_service-pvc
