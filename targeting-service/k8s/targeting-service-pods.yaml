# postgres-db-targeting-service
apiVersion: v1
kind: Pod
metadata:
  name: postgres-db-targeting-service
  namespace: targeting-service
  labels:
    app: targeting-service
    instance: postgres-db-targeting-service
spec:
  containers:
    - name: postgres-db-targeting-service
      image: postgres:18.4-alpine3.24
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
      ports:
        - containerPort: 5432
      env:
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: configmap-targeting-service
              key: DB_USERNAME
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: opaque-targeting-service
              key: DB_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: configmap-targeting-service
              key: DB_DATABASE
      volumeMounts:
        - name: pgdata-targeting-service
          mountPath: /var/lib/postgresql
  volumes:
    - name: pgdata-targeting-service
      persistentVolumeClaim:
        claimName: pvc-pgdata-targeting-service


---
# targeting-service
apiVersion: v1
kind: Pod
metadata:
  name: targeting-service
  namespace: targeting-service
  labels:
    app: targeting-service
    instance: app-targeting-service
spec:
  containers:
    - name: targeting-service
      image: targeting-service:local                                                # Local
      # image: 798350130470.dkr.ecr.us-east-1.amazonaws.com/targeting-service:latest # Nuvem
      imagePullPolicy: Never
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "300m"
          memory: "256Mi"
      ports:
        - containerPort: 8003
      env:
        - name: PORT
          value: "8003"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: opaque-targeting-service
              key: DB_URL
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: configmap-targeting-service
              key: AUTH_SERVICE_URL
    # Fazer dependencia (equivalente a depends_on no docker)
