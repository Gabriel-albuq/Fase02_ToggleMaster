apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: togglemaster
  region: us-east-2
  tags:
    Project: togglemaster
availabilityZones: ["us-east-2a", "us-east-2b", "us-east-2c"]
vpc:
  cidr: "10.0.0.0/16"
  nat:
    gateway: Single
  clusterEndpoints:
    publicAccess: true
    privateAccess: true
iam:
  withOIDC: true
managedNodeGroups:
  - name: workers
    instanceType: t3.medium
    minSize: 1
    desiredCapacity: 2
    maxSize: 5
    volumeSize: 20
    volumeType: gp3
    privateNetworking: true
    tags:
      Project: togglemaster
