# flag-service
apiVersion: v1
kind: Pod
metadata:
  name: flag-service
  namespace: flag-service
  labels:
    app: flag-service
    instance: app-flag-service
spec:
  containers:
    - name: flag-service
      image: flag-service:local                                                # Local
      # image: 798350130470.dkr.ecr.us-east-1.amazonaws.com/flag-service:latest # Nuvem
      imagePullPolicy: Never
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "300m"
          memory: "256Mi"
      ports:
        - containerPort: 8002
      env:
        - name: PORT
          value: "8002"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: opaque-flag-service
              key: DB_URL
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: configmap-flag-service
              key: AUTH_SERVICE_URL
    # Fazer dependencia (equivalente a depends_on no docker)
