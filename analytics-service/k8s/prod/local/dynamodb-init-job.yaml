# Job = o equivalente Kubernetes do container "de rodar uma vez e sair"
# (dynamodb-init) que existe no docker-compose. Diferente de um Pod solto
# ou de um Deployment, um Job e feito pra isso: roda ate terminar (ou
# tentar de novo ate "backoffLimit" vezes se falhar) e depois fica marcado
# como "Complete", sem ficar reiniciando pra sempre como um Deployment
# faria.
apiVersion: batch/v1
kind: Job
metadata:
  name: job-dynamodb-init
  namespace: analytics-service
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: dynamodb-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: dynamodb-init
          image: amazon/aws-cli:latest
          env:
            - name: AWS_ACCESS_KEY_ID
              value: "local"
            - name: AWS_SECRET_ACCESS_KEY
              value: "local"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
          command: ["sh", "-c"]
          args:
            - |
              for i in $(seq 1 10); do
                aws dynamodb create-table \
                  --table-name ToggleMasterAnalytics \
                  --attribute-definitions AttributeName=event_id,AttributeType=S \
                  --key-schema AttributeName=event_id,KeyType=HASH \
                  --billing-mode PAY_PER_REQUEST \
                  --endpoint-url http://svc-dynamodb-local:8000 \
                  --region us-east-1 && break
                sleep 2
              done
              exit 0
